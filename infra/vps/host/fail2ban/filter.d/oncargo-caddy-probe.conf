# OnCargo — rutas de escaneo en el registro JSON de Caddy (infra/vps/Caddyfile, snippet access_log).
# Las comillas internas de los valores van escapadas (\"), así que una cabecera no puede falsificar los campos.
[Definition]
failregex = ^\{.*"client_ip":"<ADDR>".*"uri":"[^"?]*(?:\.(?:php\d?|aspx?|jsp|cgi|env|ini|bak|sql)(?:[?"/])|/\.git/|/\.env|/\.aws/|/\.ssh/|/wp-(?:admin|login|content|includes|json)|/xmlrpc|/phpmyadmin|/pma/|/vendor/phpunit|/cgi-bin/|/boaform|/HNAP1|/actuator|/server-status|/owa/|/autodiscover)
ignoreregex =
datepattern = "ts":"%%Y-%%m-%%dT%%H:%%M:%%S(?:\.%%f)?%%z"
