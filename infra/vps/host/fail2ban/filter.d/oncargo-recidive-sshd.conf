# OnCargo — como recidive.conf, pero solo cuenta los bloqueos de la jail sshd: un bloqueo web (Caddy) nunca
# escala a un bloqueo del puerto 22, así el administrador no queda fuera por probar la web.
[INCLUDES]
before = common.conf
[Definition]
_daemon = (?:fail2ban(?:-server|\.actions)\s*)
failregex = ^%(__prefix_line)s(?:\s*fail2ban\.actions\s*%(__pid_re)s?:\s+)?NOTICE\s+\[sshd\]\s+Ban\s+<HOST>\s*$
datepattern = ^{DATE}
ignoreregex =
