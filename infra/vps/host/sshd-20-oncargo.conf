# OnCargo — /etc/ssh/sshd_config.d/20-oncargo.conf (lo instala infra/vps/harden.sh).
# Complementa 10-hardening.conf (sin contraseñas, root solo con clave, MaxAuthTries 4), que se aplicó al aprovisionar.
# sshd usa el PRIMER valor que encuentra: aquí solo van claves que no fijan los archivos anteriores.
# El puerto sigue en 22 (cambiarlo requiere aprobación: ver README § Seguridad del host).
AllowUsers deploy root
X11Forwarding no
AllowAgentForwarding no
PermitTunnel no
PermitUserEnvironment no
LoginGraceTime 30
MaxStartups 10:30:60
ClientAliveInterval 300
ClientAliveCountMax 2
# Algoritmos: solo intercambio de claves con curvas modernas (incluye el híbrido post-cuántico), cifrados AEAD/CTR
# y MAC encrypt-then-MAC sin SHA-1. Las claves de host no se tocan (los known_hosts existentes siguen valiendo).
KexAlgorithms sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512,diffie-hellman-group-exchange-sha256
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com
