# E2E (Playwright) contra el backend en perfil dev (Dev Services Postgres + cuentas demo).
# Manual (workflow_dispatch) y nocturno. SLA del operador en 0 para poder asignar manualmente (ver web/AGENTS.md).
name: e2e
on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'
permissions:
  contents: read
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MAVEN_OPTS: -Xmx1g
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Backend (dev)
        working-directory: backend
        run: |
          nohup ./mvnw -B quarkus:dev -Dquarkus.http.port=8180 -Dlogyx.operator.sla=PT0S -Dquarkus.console.enabled=false > "$RUNNER_TEMP/backend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/backend.pid"
      - name: Esperar backend
        run: |
          for _ in $(seq 1 120); do
            curl -fs http://localhost:8180/q/health/ready && exit 0
            sleep 5
          done
          tail -n 100 "$RUNNER_TEMP/backend.log"
          exit 1
      - name: Dependencias web y navegador
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Suite e2e
        working-directory: web
        env:
          E2E_API_URL: http://localhost:8180
        run: npm run test:e2e -- --workers=1
      - name: Reporte Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: web/test-results
          if-no-files-found: ignore
      - name: Log del backend
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: ${{ runner.temp }}/backend.log
          if-no-files-found: ignore
      - name: Detener backend
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/backend.pid" ]; then kill "$(cat "$RUNNER_TEMP/backend.pid")" 2>/dev/null || true; fi
          pkill -f quarkus || true
