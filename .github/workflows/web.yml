# Web: typecheck (astro check) y build de producción.
name: web
on:
  push:
    paths: ['web/**', 'docs/api/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', 'docs/api/**', '.github/workflows/web.yml']
permissions:
  contents: read
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
