quarkus.application.name=logyx-backend
quarkus.http.port=8080

# ---------- Base de datos ----------
quarkus.datasource.db-kind=postgresql
# En dev/test Quarkus Dev Services levanta Postgres automáticamente (Docker).
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/logyx}
%prod.quarkus.datasource.username=${DB_USER:logyx}
%prod.quarkus.datasource.password=${DB_PASSWORD:logyx}
quarkus.datasource.devservices.image-name=postgres:16-alpine
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.log.sql=false

# ---------- JWT (RSA) ----------
mp.jwt.verify.issuer=https://logyx.pe
%prod.mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY}
%prod.smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY}
logyx.jwt.ttl=PT8H

# ---------- Reglas de negocio ----------
# RN04: la subasta cierra a los 20 min o al recibir 5 ofertas
logyx.auction.duration=PT20M
logyx.auction.max-bids=5
# RN03: piso de precio = 75% del sugerido
logyx.pricing.floor-ratio=0.75

# ---------- CORS (web Astro en dev) ----------
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:4321}
# Dev: el emulador Android llama con Host 10.0.2.2:<puerto>; sin esto quarkus:dev responde 400 vacío.
%dev.quarkus.http.host-validation.require-localhost=false

# ---------- OpenAPI ----------
quarkus.smallrye-openapi.info-title=LOGYX API
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.store-schema-directory=../docs/api

# ---------- Perfil dev: datos demo (pe.logyx.devdata.DemoDataSeeder) ----------
# Subastas largas para que el marketplace demo tenga contenido abierto.
%dev.logyx.auction.duration=PT72H

# ---------- Documentos y evidencia (pe.logyx.documents) ----------
# Directorio local de archivos (fuera del repo). En prod: montar un volumen o cambiar a S3/MinIO.
logyx.documents.storage-dir=${LOGYX_DOCUMENTS_DIR:${user.home}/.logyx/documents}
%test.logyx.documents.storage-dir=${java.io.tmpdir}/logyx-test-documents
# Máximo por archivo (10 MB). El body HTTP admite un poco más por la envoltura multipart.
logyx.documents.max-size-bytes=10485760
%test.logyx.documents.max-size-bytes=204800
quarkus.http.limits.max-body-size=12M
quarkus.http.body.delete-uploaded-files-on-end=true

# ---------- Reputación: Trust Score bayesiano (RN09) ----------
logyx.reputation.prior-mean=75
logyx.reputation.prior-weight=5

# ---------- Operador: SLA (RN10) y alertas ----------
logyx.operator.sla=PT24H
logyx.operator.auction-expiring-window=PT10M

# ---------- Viajes publicados, reservas y Smart Load (pe.logyx.trip) ----------
# Smart Load Planner programado (OE07): cada cuánto genera sugerencias para todos los transportistas. "off" lo desactiva.
logyx.smartload.every=15m
%test.logyx.smartload.every=off
# Vigencia de una sugerencia (el modelo de datos pide 4 h)
logyx.smartload.ttl=PT4H
# Cierra viajes que ya salieron, completa los de hace > 24 h y vence sugerencias
logyx.trip.maintenance.every=5m
%test.logyx.trip.maintenance.every=off
