        createdAt:
          $ref: "#/components/schemas/OffsetDateTime"
    IncidentShipmentOutcome:
      type: string
      enum:
      - RESUME
      - DELIVERED
      - CANCELLED
    IncidentStatus:
      type: string
      enum:
      - OPEN
      - IN_REVIEW
      - RESOLVED
      - CLOSED
    IncidentView:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        shipmentId:
          $ref: "#/components/schemas/UUID"
        requesterOrgId:
          $ref: "#/components/schemas/UUID"
        requesterName:
          type: string
        carrierOrgId:
          $ref: "#/components/schemas/UUID"
        carrierName:
          type: string
        reportedByOrgId:
          $ref: "#/components/schemas/UUID"
        category:
          $ref: "#/components/schemas/IncidentCategory"
        description:
          type: string
        status:
          $ref: "#/components/schemas/IncidentStatus"
        active:
          type: boolean
        resolutionNotes:
          type: string
        createdAt:
          $ref: "#/components/schemas/OffsetDateTime"
        updatedAt:
          $ref: "#/components/schemas/OffsetDateTime"
        resolvedAt:
          $ref: "#/components/schemas/OffsetDateTime"
        comments:
          type: array
          items:
            $ref: "#/components/schemas/IncidentCommentView"
        shipmentOutcome:
          $ref: "#/components/schemas/IncidentShipmentOutcome"
    Instant:
      type: string
      format: date-time
      examples:
      - 2022-03-10T16:15:50Z
    LocalDate:
      type: string
      format: date
      examples:
      - 2022-03-10
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          pattern: \S
        password:
          type: string
          pattern: \S
    ManualAssignment:
      type: object
      required:
      - carrierOrgId
      - vehicleId
      properties:
        carrierOrgId:
          $ref: "#/components/schemas/UUID"
        vehicleId:
          $ref: "#/components/schemas/UUID"
        amount:
          type: number
          minimum: 1
        notes:
          type: string
          maxLength: 300
    ManualAssignmentResult:
      type: object
      properties:
        shipmentId:
          $ref: "#/components/schemas/UUID"
        bidId:
          $ref: "#/components/schemas/UUID"
        requestId:
          $ref: "#/components/schemas/UUID"
        carrierOrgId:
          $ref: "#/components/schemas/UUID"
        carrierName:
          type: string
        amount:
          type: number
        vehiclePlate:
