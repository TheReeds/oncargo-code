      type: object
      properties:
        incidentId:
          $ref: "#/components/schemas/UUID"
        shipmentId:
          $ref: "#/components/schemas/UUID"
        category:
          $ref: "#/components/schemas/IncidentCategory"
        status:
          $ref: "#/components/schemas/IncidentStatus"
        requesterName:
          type: string
        carrierName:
          type: string
        originCity:
          $ref: "#/components/schemas/City"
        destinationCity:
          $ref: "#/components/schemas/City"
        reportedAt:
          $ref: "#/components/schemas/OffsetDateTime"
        hoursOpen:
          type: integer
          format: int64
    IncidentCategory:
      type: string
      enum:
      - CARGO_DAMAGE
      - DELAY
      - LOST_CARGO
      - WRONG_DELIVERY
      - DRIVER_CONDUCT
      - OTHER
    IncidentCommentView:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        authorOrgId:
          $ref: "#/components/schemas/UUID"
        authorName:
          type: string
        body:
