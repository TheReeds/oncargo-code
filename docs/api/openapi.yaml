        bidId:
          $ref: "#/components/schemas/UUID"
        bidAmount:
          type: number
        bidStatus:
          $ref: "#/components/schemas/Status3"
        messageCount:
          type: integer
          format: int64
        lastMessage:
          type: string
        lastMessageAt:
          $ref: "#/components/schemas/OffsetDateTime"
