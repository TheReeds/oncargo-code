      type: string
      enum:
      - SERVICE_ORDER
      - REMISSION_GUIDE
      - RECEIPT
      - DELIVERY_PHOTO
      - SIGNATURE
      - OTHER
    DocumentView:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        shipmentId:
          $ref: "#/components/schemas/UUID"
        stopId:
          $ref: "#/components/schemas/UUID"
        type:
          $ref: "#/components/schemas/DocumentType"
        fileName:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: integer
          format: int64
        uploadedByOrgId:
          $ref: "#/components/schemas/UUID"
        createdAt:
          $ref: "#/components/schemas/OffsetDateTime"
        downloadUrl:
          type: string
