      type: string
      enum:
      - LIMA
      - ICA
      - NAZCA
      - AREQUIPA
      - MOQUEGUA
      - TACNA
      - JULIACA
      - PUNO
      - CUSCO
      - ABANCAY
      - AYACUCHO
    CityItem:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
    CloseReason:
      type: string
      enum:
      - TIMEOUT
      - MAX_BIDS
      - ACCEPTED
      - CANCELLED
    CounterOfferStatus:
      type: string
      enum:
      - PENDING
      - ACCEPTED
      - REJECTED
      - EXPIRED
    CounterOfferView:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        bidId:
          $ref: "#/components/schemas/UUID"
        requestId:
          $ref: "#/components/schemas/UUID"
        carrierOrgId:
          $ref: "#/components/schemas/UUID"
        offeredByOrgId:
          $ref: "#/components/schemas/UUID"
        previousAmount:
          type: number
        amount:
          type: number
        message:
          type: string
        status:
          $ref: "#/components/schemas/CounterOfferStatus"
        createdAt:
          $ref: "#/components/schemas/OffsetDateTime"
        respondedAt:
          $ref: "#/components/schemas/OffsetDateTime"
        proposedByCarrier:
          type: boolean
    CreateRequest:
      type: object
      required:
      - originCity
      - originAddress
      - destinationCity
      - destinationAddress
      - cargoType
      - cargoDescription
      - weightKg
      - pickupDate
      properties:
        originCity:
          type: string
          pattern: \S
        originAddress:
          type: string
          pattern: \S
          maxLength: 200
        destinationCity:
          type: string
          pattern: \S
        destinationAddress:
          type: string
          pattern: \S
          maxLength: 200
        cargoType:
          $ref: "#/components/schemas/CargoType"
        cargoDescription:
          type: string
          pattern: \S
          maxLength: 300
        weightKg:
          type: number
          maximum: 40000
          minimum: 1
        volumeM3:
          type: number
          minimum: 0.01
        pickupDate:
          $ref: "#/components/schemas/LocalDate"
    CreateTripBookingRequest:
      type: object
      required:
      - weightKg
      - cargoDescription
      - cargoType
      - pickupAddress
      - deliveryAddress
      properties:
        weightKg:
          type: number
          maximum: 40000
          minimum: 1
        cargoDescription:
          type: string
          pattern: \S
          maxLength: 300
        cargoType:
          $ref: "#/components/schemas/CargoType"
        pickupAddress:
          type: string
          pattern: \S
          maxLength: 200
        deliveryAddress:
          type: string
          pattern: \S
          maxLength: 200
    CreateTripRequest:
      type: object
      required:
      - originCity
      - destinationCity
      - departureAt
      - vehicleId
      - capacityKg
      - pricingMode
      - rate
      properties:
        originCity:
          type: string
          pattern: \S
        destinationCity:
          type: string
          pattern: \S
        departureAt:
          $ref: "#/components/schemas/OffsetDateTime"
        vehicleId:
          $ref: "#/components/schemas/UUID"
        capacityKg:
          type: number
          maximum: 40000
          minimum: 1
        pricingMode:
          $ref: "#/components/schemas/TripPricingMode"
        rate:
          type: number
          maximum: 1000000
          minimum: 0.01
        notes:
          type: string
          maxLength: 300
    DashboardSummaryView:
      type: object
      properties:
        role:
          $ref: "#/components/schemas/OrgType"
        activeRequests:
          type: integer
          format: int64
        bidsToReview:
          type: integer
          format: int64
        shipmentsInTransit:
          type: integer
          format: int64
        compatibleLoads:
          type: integer
          format: int64
        pendingBids:
          type: integer
          format: int64
        activeShipments:
          type: integer
          format: int64
        deliveredThisMonth:
          type: integer
          format: int64
        openTrips:
          type: integer
          format: int64
        pendingTripBookings:
          type: integer
          format: int64
        pendingSmartLoads:
          type: integer
          format: int64
        returnLoads:
          type: integer
          format: int64
        topReturnLoads:
          type: array
          items:
            $ref: "#/components/schemas/ReturnLoadHintView"
        activeTripBookings:
          type: integer
          format: int64
