      type: object
      required:
      - driverId
      properties:
        driverId:
          $ref: "#/components/schemas/UUID"
        reason:
          type: string
          maxLength: 500
    AssignmentCandidateView:
      type: object
      properties:
        carrierOrgId:
          $ref: "#/components/schemas/UUID"
        carrierName:
          type: string
        carrierRucVerified:
          type: boolean
        carrierTrustScore:
          type: number
        vehicleId:
          $ref: "#/components/schemas/UUID"
        vehiclePlate:
          type: string
        vehicleType:
          $ref: "#/components/schemas/Type"
        maxWeightKg:
          type: number
    AuctionView:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        status:
          $ref: "#/components/schemas/Status4"
        closesAt:
          $ref: "#/components/schemas/OffsetDateTime"
        maxBids:
          type: integer
          format: int32
        bidCount:
          type: integer
          format: int64
        closeReason:
          $ref: "#/components/schemas/CloseReason"
    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer
          format: int64
        user:
          $ref: "#/components/schemas/UserInfo"
    BidView:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        requestId:
          $ref: "#/components/schemas/UUID"
        carrierOrgId:
          $ref: "#/components/schemas/UUID"
        carrierName:
          type: string
        carrierRucVerified:
          type: boolean
        vehicleId:
          $ref: "#/components/schemas/UUID"
        amount:
          type: number
        notes:
          type: string
        status:
          $ref: "#/components/schemas/Status3"
        createdAt:
          $ref: "#/components/schemas/OffsetDateTime"
        vehicleType:
          $ref: "#/components/schemas/Type"
        vehiclePlate:
          type: string
        carrierTrustScore:
          type: number
        assignedByOperator:
          type: boolean
    BookingStatus:
      type: string
      enum:
      - PENDING
      - CONFIRMED
      - REJECTED
      - CANCELLED
    CancelRequestBody:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
    CancelShipment:
      type: object
      required:
      - reason
      properties:
        reason:
          type: string
          pattern: \S
          maxLength: 500
    CargoItem:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
    CargoType:
      type: string
      enum:
      - GENERAL
      - FRAGILE
      - PERISHABLE
      - HAZARDOUS
      - BULK
      - OVERSIZED
