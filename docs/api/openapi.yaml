      type: object
      required:
      - fullName
      - email
      - password
      - licenseNumber
      properties:
        fullName:
          type: string
          pattern: \S
          maxLength: 150
        email:
          type: string
          pattern: \S
        password:
          type: string
          pattern: \S
          minLength: 8
          maxLength: 72
        licenseNumber:
          type: string
          pattern: \S
          maxLength: 20
    DriverView:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        fullName:
          type: string
        email:
          type: string
        licenseNumber:
          type: string
        status:
          $ref: "#/components/schemas/Status1"
